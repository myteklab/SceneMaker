<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SceneMaker Scene</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; overflow: hidden; background: #e8ecf2; }
  #viewer-canvas { width: 100%; height: 100%; display: block; touch-action: none; cursor: grab; }
  #viewer-hint {
    position: fixed; bottom: 14px; left: 50%; transform: translateX(-50%);
    background: rgba(30, 36, 48, 0.72); color: #fff; border-radius: 999px;
    padding: 7px 16px; font-family: system-ui, -apple-system, sans-serif;
    font-size: 12.5px; pointer-events: none; white-space: nowrap;
    transition: opacity 1.2s ease;
  }
  #viewer-hint.faded { opacity: 0; }
</style>
</head>
<body>
<canvas id="viewer-canvas"></canvas>
<div id="viewer-hint" style="display:none">This scene is alive: hover, click, and press keys!</div>
<script type="importmap">
  { "imports": { "three": "./vendor/three/three.module.min.js" } }
</script>
<script type="module" src="./js/viewer.mjs?v=4"></script>
</body>
</html>
